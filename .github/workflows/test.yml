name: Test

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read # checkout repository for Go CI
    uses: berquerant/reusable-workflows/.github/workflows/go-ci.yml@v0.5.0
    with:
      lint-command: make lint
      test-command: make test
      build-command: make
      timeout-minutes: 5

  actions-lock-verify:
    permissions:
      contents: read # checkout repository and verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.5.0
